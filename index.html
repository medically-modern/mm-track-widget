<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MM Track</title>
<style>*{margin:0;padding:0;}</style>
</head><body>
<script>
(function() {
  // Medically Modern — Form Drop-off Tracker
  // Fires a single beacon when this widget's page becomes visible.
  // JotForm preloads ALL widget iframes at once, but hidden-page iframes
  // have 0x0 dimensions. We poll for non-zero size to detect page activation.

  var API = 'https://mm-doctor-api-production.up.railway.app/api/intake/track';
  var fired = false;

  var params = new URLSearchParams(window.location.search);
  var page = params.get('page') || '0';
  var formId = params.get('form') || '';

  function fireBeacon() {
    if (fired) return;
    fired = true;
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        page: parseInt(page, 10),
        form: formId,
        ts: Date.now()
      })
    }).catch(function() {});
  }

  function isVisible() {
    // JotForm sets hidden-page iframes to 0x0. Check our own viewport.
    return document.documentElement.clientWidth > 0 &&
           document.documentElement.clientHeight > 0;
  }

  // Immediate check — if already visible (page 1 on load), fire now.
  if (isVisible()) {
    fireBeacon();
  } else {
    // Poll every 500ms for visibility (page navigation).
    var poll = setInterval(function() {
      if (isVisible()) {
        clearInterval(poll);
        fireBeacon();
      }
    }, 500);
    // Stop polling after 10 minutes (user abandoned form).
    setTimeout(function() { clearInterval(poll); }, 600000);
  }
})();
</script>
</body></html>
