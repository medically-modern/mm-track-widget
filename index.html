<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MM Track</title>
<style>*{margin:0;padding:0;}</style>
</head><body>
<script>
(function() {
  // Medically Modern — Form Drop-off Tracker V2
  // Fires a single beacon when this widget's page becomes visible.
  // Now captures field values passed via URL params by JotForm token interpolation.
  // JotForm preloads ALL widget iframes at once, but hidden-page iframes
  // have 0x0 dimensions. We poll for non-zero size to detect page activation.

  var API = 'https://mm-doctor-api-production.up.railway.app/api/intake/track';
  var fired = false;

  var params = new URLSearchParams(window.location.search);
  var page   = params.get('page') || '0';
  var formId = params.get('form') || '';

  // Field values interpolated by JotForm from the form state at render time.
  // Pages 2+ will have these filled in because page 1 fields are required.
  var fn  = params.get('fn')  || '';  // firstName
  var ln  = params.get('ln')  || '';  // lastName
  var em  = params.get('em')  || '';  // email
  var ph  = params.get('ph')  || '';  // phone
  var dob = params.get('dob') || '';  // dateOfBirth
  var prd = params.get('prd') || '';  // productSelection

  function fireBeacon() {
    if (fired) return;
    fired = true;
    var payload = {
      page: parseInt(page, 10),
      form: formId,
      ts: Date.now()
    };
    // Only include fields that have actual values (not empty JotForm tokens)
    if (fn && fn !== '{firstName}')            payload.fn  = fn;
    if (ln && ln !== '{lastName}')             payload.ln  = ln;
    if (em && em !== '{emailAddress}')         payload.em  = em;
    if (ph && ph !== '{phoneNumber:full}')     payload.ph  = ph;
    if (dob && dob !== '{dateOfBirth}')        payload.dob = dob;
    if (prd && prd !== '{productSelection}')   payload.prd = prd;

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(function() {});
  }

  function isVisible() {
    return document.documentElement.clientWidth > 0 &&
           document.documentElement.clientHeight > 0;
  }

  if (isVisible()) {
    fireBeacon();
  } else {
    var poll = setInterval(function() {
      if (isVisible()) {
        clearInterval(poll);
        fireBeacon();
      }
    }, 500);
    setTimeout(function() { clearInterval(poll); }, 600000);
  }
})();
</script>
</body></html>
