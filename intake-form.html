<!DOCTYPE html>
<!-- v=2026-08-06T0000 cache-bust -->
<html lang="en">
<head>
<!-- Resume token, taken off the URL before anything else runs.
     A patient who tapped "text me my link" arrives at …/#r=<token>. That token
     is a credential for their own intake data, so it comes off the address bar
     FIRST — ahead of Clarity below, which records the page URL into a session
     replay, and ahead of anything that could put it in a Referer header. It is
     read from the fragment rather than a query string precisely so it never
     reached a server log on the way here either. -->
<script type="text/javascript">
  window.__mmResumeToken = "";
  (function(){
    try {
      var m = /[#&?]r=([A-Za-z0-9_.\-]+)/.exec(location.hash || "") ||
              /[?&]r=([A-Za-z0-9_.\-]+)/.exec(location.search || "");
      if(!m) return;
      window.__mmResumeToken = m[1];
      if(history && history.replaceState){
        history.replaceState(null, "", location.pathname);
      }
    } catch(e){ /* a resume that can't clean the URL still beats no resume */ }
  })();
</script>

<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "wlf9luix56");
</script>

<meta charset="UTF-8">
<!-- Without this, phones lay the page out at Safari's legacy 980px width and
     scale it down — the whole form renders at half size. The marketing site's
     iframe masked it (the parent page's viewport governs there); anyone on the
     standalone URL, which is every resume link, got the tiny version. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medically Modern — Intake Redesign</title>
<style>
  :root{
    --ink:#1c3d4d;
    --ink-2:#5a7280;
    --mint:#e6f2ef;
    --sage:#a8ccc4;
    --petrol:#1c3d4d;
    --line:#dfe7e6;
    --gold:#c3901f;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* The whole shell in two numbers. --shell-max is the readable column the
       flow lives in; --shell-pad is its inset from the window edge. Widening
       the form is a one-line change here, not a hunt through the rules. */
    --shell-max: 560px;
    --shell-pad: 20px;
    /* Clearance under the pinned action. This is NOT a decorative margin —
       deleting it puts Continue back under iOS Safari's toolbar. See .frame. */
    --shell-floor: 96px;
  }
  *{box-sizing:border-box;}

  /* ---------------------------------------------------------------------------
     The form IS the page — it does not sit on one (Josh, 2026-08-19; the Hims
     intake as the reference).

     What this replaced: a grey #f2f3f2 field with a 420px white card floating
     in the middle of it, rounded and shadowed. On a laptop that read as a
     phone mockup pasted onto a desktop page — a 420px sliver at x=510 of a
     1440px window, with ~1000px of empty grey around it.

     Nothing upstream was imposing that. medicallymodern.com/intake-form/ is an
     Elementor *canvas* page (no site header, no footer) whose entire body is
       <div style="width:100%;height:100vh;overflow:hidden">
         <iframe src="…/intake-form.html" style="width:100%;height:100%">
     so the iframe is already handed the whole window, and the parent cannot
     scroll — anything taller than the view scrolls inside here. The card was
     this file electing to use a fraction of a viewport it already owned, which
     is why the takeover needs no change to the marketing site.
     --------------------------------------------------------------------------- */
  body{
    margin:0; padding:0;
    /* dvh helps ONLY on the standalone URL every texted resume link opens,
       where this file is the top-level document and dvh really does exclude
       the browser's toolbars; the vh line is the fallback for browsers
       without it. Embedded, both resolve to the iframe box and neither can
       see the toolbar — which is what --shell-floor on .frame is for. */
    min-height:100vh;
    min-height:100dvh;
    background:#fff;
    font-family:var(--sans);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
  }
  /* One column that fills the window top to bottom: .rig fills body, .frame
     fills .rig, #card fills .frame. Every one is `flex:1 0 auto` — grow into
     the spare room, but never shrink below content, so a long step (insurance,
     doctor) still lays out at its natural height and scrolls the document. */
  .rig{width:100%; max-width:var(--shell-max); flex:1 0 auto; display:flex;}
  .frame{
    flex:1 0 auto; display:flex; flex-direction:column; width:100%; min-width:0;
    background:#fff;
    /* max() so a notched phone in landscape can't tuck the form under the
       cutout now that it runs to the window edge.

       ⚠️ --shell-floor is load-bearing (Josh, 2026-08-19, reported against the
       live form). iOS Safari's floating toolbar OVERLAYS the bottom of the
       page, and the parent sizes our iframe with `height:100vh` — which on iOS
       is the LARGE viewport, i.e. the height with the toolbars retracted. So
       the bottom ~55px of this frame sits in a strip that is never painted,
       and Continue, pinned to the bottom, landed under the toolbar pill.

       Nothing inside the iframe can measure that strip: an iframe's dynamic
       viewport (dvh) is its own box, fixed at whatever the parent gave it, so
       dvh reports the same number as vh here and cannot see browser chrome.
       env(safe-area-inset-bottom) is 0 for the same reason. The only honest
       fix from this file is to reserve the space.

       The card layout this replaced had it by accident — body carried
       `padding-bottom:80px`. The takeover cut that to 26px AND pushed the
       button to the very bottom, which is what surfaced the overlap.

       The real root fix is one word in the PARENT: the wrapper on
       medicallymodern.com/intake-form/ should be `height:100dvh`, not 100vh —
       then the iframe is sized to what is actually visible and this reserve
       becomes ordinary breathing room. That page is WordPress/Elementor, not
       this repo, so the reserve stays until someone changes it there. */
    padding:
      calc(22px + env(safe-area-inset-top))
      max(var(--shell-pad), env(safe-area-inset-right))
      0
      max(var(--shell-pad), env(safe-area-inset-left));
  }
  /* Making #card a flex column is what finally switches on the .spacer that
     every step has always emitted just above its Continue button: with the
     column filling the window, the spacer eats the slack and pins Continue to
     the bottom of the view, which is the behaviour being copied. Until now
     #card was a plain block, so .spacer{flex:1} matched nothing and the button
     simply trailed the content. */
  #card{flex:1 0 auto; display:flex; flex-direction:column;}
  /* Two consequences of #card's children becoming flex items, both of which
     silently ADD vertical space to a rhythm that was tuned under block layout.
     Corrected here rather than absorbed, and these are the only two shapes in
     the whole flow that hit them (checked by measuring every step's boxes
     against the previous build, not by reading).

     1. A flex item contains its descendants' margins instead of letting the
        last one escape — so a .qblock ended 11px taller AND kept the gap below
        it, i.e. paid for the same margin twice. */
  #card > .qblock > :last-child{margin-bottom:0;}
  /*  2. Adjacent margins no longer collapse to the larger of the two, they sum.
        Two pairs in the flow carry a positive margin on both sides: one doubled
        a deliberate 14px gap to 28px, the other pushed a section label 2px off
        its group. Zeroing the smaller of each pair restores the collapsed
        value, and both rules are scoped so they can only bite where the item
        actually sits in the flex column. */
  .privacy-line + .save-pill{margin-top:0;}
  #card > .section-label{margin-bottom:0;}

  /* ---------------------------------------------------------------------------
     The action dock — why the primary button is sticky (Josh, 2026-08-19, second
     report on the live form).

     Reserving space at the bottom (--shell-floor) is NOT enough on its own, and
     the reason is worth writing down because it is easy to "fix" the same bug
     twice. Padding can only decide where the button sits when there is SLACK.
     On the tallest steps there is none: measured off the reported iPhone, the
     option cards end 784px down an 877px frame, Safari's toolbar covers
     everything past 821px, and the button needs 50px — so the content itself
     has already run past the toolbar line before the button is even laid out.
     Grow the floor and the document just gets taller; the button does not move
     up a pixel, because its position is content-determined, not box-determined.

     Sticky is what actually moves it. `bottom: --shell-floor` keeps the dock's
     bottom edge that far above the viewport at all times: it rides at the end
     of the flow when the step is short (the constraint is already met, so
     nothing shifts and the layout is byte-identical to before), and lifts off
     the content to sit above the toolbar when the step is tall. The button is
     then reachable on arrival at every step, on any viewport, with no scroll —
     which the floor alone could not promise.

     The floor is still load-bearing: it is what the dock's `bottom` is measured
     from. See the note on .frame for why nothing here can measure the toolbar
     and why the real fix lives on the parent page.
     --------------------------------------------------------------------------- */
  .action-dock{
    position:sticky;
    bottom:0;
    background:#fff;
    z-index:2;   /* over the content it lifts off; under .ac-list, which is 10 */
    /* ⚠️ The floor lives HERE, not on .frame, and `bottom` is 0 rather than the
       floor — because the dock's background has to reach the bottom of the
       WINDOW. Held the other way round (floor on .frame, bottom:96px) the white
       stopped at the button and the content it had lifted off went on scrolling
       through the 96px below it, framed by the dock above and the toolbar
       below. Owning the floor as padding puts that strip inside the dock's own
       box, so it is painted. */
    padding-bottom:calc(var(--shell-floor) + env(safe-area-inset-bottom));
  }
  /* A step with no primary button (the completed screen) gets no dock, so it
     has to carry the floor itself — an empty dock is not the answer, since
     sticky would lift it over the last of that screen's tappable options. */
  #card.no-dock{padding-bottom:calc(var(--shell-floor) + env(safe-area-inset-bottom));}
  /* so tall content dissolves into the dock instead of being guillotined by it */
  .action-dock::before{
    content:''; position:absolute; left:0; right:0; bottom:100%; height:22px;
    background:linear-gradient(rgba(255,255,255,0), #fff); pointer-events:none;
  }

  .app-head{display:flex; align-items:center; margin-bottom:18px;}
  .app-logo-img{height:26px; width:auto; display:block;}
  .app-bar{height:3px; background:#eef1f0; border-radius:20px; overflow:hidden; margin-bottom:20px;}
  .app-bar i{display:block; height:100%; background:var(--petrol); transition:width .3s;}
  .back-line{font-size:18px; color:var(--ink-2); margin-bottom:18px; cursor:pointer; line-height:1;}

  h1.step-title{font-size:26px; line-height:1.16; letter-spacing:-.02em; font-weight:700; color:var(--ink); margin:0 0 10px;}
  .step-sub{font-size:14px; line-height:1.5; color:var(--ink-2); margin:0 0 20px;}
  .hint{font-size:13px; color:var(--ink-2); margin:-2px 0 18px;}
  .plain-note{font-size:13px; line-height:1.5; color:var(--ink-2); margin:0 0 18px;}

  .options{display:flex; flex-direction:column; margin-bottom:6px;}
  .opt{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    border:1px solid var(--line); border-radius:13px; padding:17px 16px; margin-bottom:11px;
    background:#fff; cursor:pointer; font-family:var(--sans); text-align:left;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--sage);}
  .opt.selected{border-color:var(--petrol); background:var(--mint);}
  .lbl{font-size:15px; font-weight:600; line-height:1.3; color:var(--ink); display:block;}
  .lbl-sub{display:block; font-size:12.5px; font-weight:400; color:var(--ink-2); margin-top:4px; line-height:1.4;}

  /* uniform selection marks: chevron for pick-one, checkbox for pick-many */
  .mark-arrow{
    flex:0 0 auto; width:8px; height:8px; border-top:2px solid #c6d3d6; border-right:2px solid #c6d3d6;
    transform:rotate(45deg); transition:border-color .15s; margin-right:2px;
  }
  .opt.selected .mark-arrow{border-color:var(--petrol);}
  .mark-check{width:21px; height:21px; border:1.5px solid #c6d3d6; border-radius:6px; flex:none; background:#fff; position:relative;}
  .opt.selected .mark-check{border-color:var(--petrol); background:var(--petrol);}
  .opt.selected .mark-check::after{
    content:''; position:absolute; left:6.5px; top:3px; width:5px; height:10px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
  }

  /* testimonial treatment C: stars + set apart */
  .quoteC{display:block; margin-top:9px; padding-left:11px; border-left:2px solid var(--sage);}
  .starsC{display:inline; font-size:11px; color:var(--gold); letter-spacing:.06em; margin-right:5px;}
  .qC{display:block; font-size:12.5px; font-weight:400; color:var(--ink-2); line-height:1.5;}
  .attrC{display:block; font-size:11px; color:#8fa0a8; margin-top:5px; font-weight:500;}

  label{font-size:13px; font-weight:600; color:var(--ink); margin-bottom:5px; display:block;}
  input[type=text], input[type=email], input[type=tel], select{
    width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:11px;
    font-size:16px; font-family:var(--sans); margin-bottom:14px; color:var(--ink); background:#fff;
  }
  select{ appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%235a7280'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; background-size:14px; padding-right:36px; font-size:16px;}  /* 16px, not 15 — a select under 16px makes iOS Safari zoom the page in when it opens */
  input:focus, select:focus{outline:2px solid var(--sage); outline-offset:1px; border-color:var(--petrol);}
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}

  .spacer{flex:1;}
  .btn-primary{
    background:var(--petrol); color:#fff; border:none; padding:16px 22px; border-radius:999px;
    font-size:16px; font-weight:700; cursor:pointer; font-family:var(--sans);
    transition:background .15s, box-shadow .15s, transform .1s;
    box-shadow:0 4px 14px rgba(28,61,77,.22);
  }
  /* pointer-events:none lets a tap on the DISABLED button fall through to the
     .cont-wrap around it, which answers with why it's grey (blockedContinueTap). */
  .btn-primary:disabled{background:#e6ebe9; color:#a4b0ac; cursor:not-allowed; box-shadow:none; pointer-events:none;}
  .btn-primary:not(:disabled):hover{background:#12303d; box-shadow:0 6px 18px rgba(28,61,77,.3);}
  .btn-primary:not(:disabled):active{transform:scale(.98);}
  .btn-primary-full{width:100%; display:block; text-align:center;}
  .btn-ghost{background:none; border:none; color:var(--ink-2); font-size:13px; cursor:pointer; padding:8px 4px; text-decoration:underline; font-family:var(--sans);}
  .note{font-size:11.5px; color:#8a9793; text-align:center; margin-top:14px; line-height:1.5;}

  /* save & finish later — quiet, modern DTC treatment, no underline/link-blue */
  .save-pill{
    text-align:center; margin-top:14px; font-size:13px; font-weight:600; color:var(--ink-2);
    cursor:pointer; letter-spacing:.01em; transition:color .15s;
  }
  .save-pill:hover{color:var(--petrol);}

  /* the "we texted you your link" screens */
  .link-note{
    background:var(--mint); border-radius:12px; padding:13px 15px; font-size:13px;
    color:var(--petrol); line-height:1.55; margin-bottom:14px;
  }
  .link-copy{
    display:flex; gap:8px; align-items:center; margin:12px 0 4px;
  }
  .link-copy input{
    flex:1; margin:0; font-size:12.5px; color:var(--ink-2); background:#f7f9f9;
  }
  .link-copy button{
    flex:0 0 auto; padding:12px 14px; font-size:13px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); border-radius:11px; background:#fff; color:var(--petrol);
    font-family:var(--sans);
  }

  /* why-can't-I-continue feedback */
  .field-err{display:none; font-size:12.5px; color:#b04434; margin:-9px 0 12px; line-height:1.45;}
  .field-err.show{display:block;}
  input.invalid{border-color:#c9705f;}
  input.invalid:focus{outline-color:#ecc4bb; border-color:#c9705f;}
  .cont-hint{display:none; text-align:center; font-size:13px; color:#b04434; margin-top:10px; line-height:1.45;}
  .cont-hint.show{display:block;}

  .fine-print{font-size:12px; color:#8a9aa0; text-align:center; margin-top:16px; line-height:1.5;}
  .privacy-line{font-size:12px; color:var(--ink-2); text-align:center; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:5px;}

  .autocomplete-wrap{position:relative; margin-bottom:14px;}
  .autocomplete-wrap input{margin-bottom:0;}
  .ac-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff; border:1px solid var(--line);
    border-radius:11px; box-shadow:0 6px 18px rgba(28,61,77,.12); max-height:200px; overflow-y:auto; z-index:10;
  }
  .ac-item{padding:11px 14px; font-size:14px; color:var(--ink); cursor:pointer;}
  .ac-item:hover, .ac-item.hi{background:var(--mint);}
  .ac-item b{color:var(--petrol);}
  .ac-empty{padding:11px 14px; font-size:12.5px; color:var(--ink-2);}

  .two-col-groups{display:flex; gap:10px; flex-wrap:wrap;}
  .two-col-groups .section-group{flex:1; min-width:150px; margin-top:16px; padding:12px 11px 2px;}
  .section-group{
    margin-top:18px; padding:16px 16px 6px; border-radius:14px; border:1px solid var(--line);
    background:#fbfcfc;
  }
  .section-group-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--petrol);
    margin-bottom:12px;
  }
  .qblock{margin-top:16px;}
  .qblock:first-child{margin-top:0;}
  .optional-tag{font-weight:400; text-transform:none; font-style:italic; color:var(--ink-2);}
  .section-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2); margin-bottom:2px;
  }
  .section-divider{height:1px; background:var(--line); margin:20px 0 16px;}

  /* max-height keeps a portrait shot from shoving Continue below the fold;
     width:auto preserves the aspect either way. */
  .card-preview{
    display:block; width:auto; max-width:100%; max-height:190px; margin:0 auto 18px;
    border:1px solid var(--line); border-radius:12px;
  }

    border:1.5px dashed var(--petrol); border-radius:11px; padding:14px 12px; background:#fff;
  }
  .upload-zone:hover{background:var(--mint);}
  .upload-zone .u-title{font-size:13px; font-weight:600; color:var(--ink);}
  .upload-zone .u-sub{font-size:11.5px; color:var(--ink-2);}
  .upload-zone .choose-btn{
    margin-top:2px; background:#fff; color:var(--petrol); border:1px solid var(--petrol); border-radius:6px;
    padding:6px 14px; font-size:12.5px; font-weight:600; font-family:var(--sans); display:inline-block;
  }

  .divider{
    text-align:center; font-size:12px; color:var(--petrol); margin:0; height:0; overflow:hidden;
    opacity:0; transition:opacity .3s;

  .manual-fields{display:none;}
  .manual-fields.show{display:block; margin-top:10px;}

  .confirm-title{font-size:22px; font-weight:700; text-align:center; color:var(--ink); margin:0 0 8px; letter-spacing:-.01em;}
  .confirm-sub{font-size:13.5px; text-align:center; color:var(--ink-2); margin-bottom:18px;}
  .contact-btn{

    background:var(--petrol); color:#fff; border:none; padding:14px; border-radius:999px;
    font-size:14.5px; font-weight:700; cursor:pointer; font-family:var(--sans); text-decoration:none; margin-bottom:12px;
  }

  .next-steps{list-style:none; padding:0; margin:0 0 14px;}
  .next-steps li{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .next-steps li:last-child{border-bottom:none;}
  .next-steps .num{
    width:24px; height:24px; border-radius:50%; background:var(--mint); color:var(--petrol);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;
  }

  /* ---------------------------------------------------------------------------
     Wider than a phone. The page still fills the window; the COLUMN just stops
     growing with it at --shell-max, because a text input stretched across
     1400px is unreadable and is not what the reference does either.

     The spacer is deliberately NOT capped here, so Continue sits on the bottom
     edge of a laptop window exactly as it does on a phone. Capping it was tried
     first and is the worse of the two: it clusters the step at the top and
     leaves the leftover white space UNDER the button, which reads as a page
     that ran out. Pinned, the same space falls between the content and the
     action, which is just a layout — and it keeps the button in one fixed place
     the whole way through the flow.
     --------------------------------------------------------------------------- */
  @media (min-width:700px){
    /* keeps the safe-area term — this query also matches a phone in landscape */
    .frame{padding-top:calc(40px + env(safe-area-inset-top));}
  }
</style>

<body>

<div class="rig">

<script>
/* ---------------------------------------------------------------------------
   Backend. Partial fill-outs and completed submissions both land on the
   Profile Send Off board (18406352652) via this service.
--------------------------------------------------------------------------- */
const API_BASE   = 'https://dtc-mm-form-api-production.up.railway.app';
const TRACK_URL  = API_BASE + '/api/intake/track';
const SUBMIT_URL = API_BASE + '/api/intake/submit';
const SCHEDULING_URL = API_BASE + '/api/intake/scheduling';
const RESUME_LINK_URL = API_BASE + '/api/intake/resume-link';
const RESUME_URL      = API_BASE + '/api/intake/resume';
const CONTACT_CARD_URL = API_BASE + '/api/intake/contact.vcf';
const CARD_PHOTO_URL  = API_BASE + '/api/intake/card-photo';

const state = {
  step: 1,
  reason: null,
  firstName: '', lastName: '', phone: '', dob: '', email: '',
  needsCategories: [],
  step3PhaseIdx: 0,
  cgmType: null, cgmReason: null,
  pumpType: null, pumpStatus: null,
  insurance: null,
  insurancePhase: 'choice', // choice | photoCapture | providerPick | fields
  doctorName: '', doctorContact: '',
  manualProvider: '', manualMemberId: '', manualState: '', manualOtherProvider: '',
  secondaryInsurance: null, secondaryMethod: null, secondaryProvider: '', secondaryMemberId: '', secondaryOtherProvider: '',
  cardPhotos: [],
  /* Whether each card photo has landed on the patient's monday row (the
     instant upload). Persisted — a resumed session must know the card is
     already on file even though the photo bytes never travel. The transient
     per-slot progress lives in cardUploadState and is never saved. */
  cardFrontUploaded: false, cardSecondaryUploaded: false,
  cardUploadState: {},
  callBooked: null,
  proceedChoice: null,
  submitting: false,
  submitted: false,
};

/* Resume on the same device. The patient's answers otherwise live only in this
   tab — closing it loses everything, which made "Save & finish later" a claim
   we weren't keeping. Photos are deliberately NOT stored: a couple of
   downscaled cards would be most of the ~5MB localStorage budget and could
   push the whole save over the limit, losing the text answers too. */
const SAVE_KEY = 'mm_intake_progress_v1';
const SAVE_TTL_MS = 7 * 24 * 60 * 60 * 1000;

function saveProgress(){
  try {
    const keep = Object.assign({}, state);
    delete keep.cardPhotos; delete keep.submitting; delete keep.submitted;
    delete keep.cardUploadState;
    /* The resume token rides along so a reload on this device stays attached to
       the row the patient already has, rather than starting a second one once
       the server's short-lived session keys age out. */
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      savedAt: Date.now(), state: keep, resumeToken: RESUME_TOKEN || '',
    }));
  } catch(e){ /* private mode or full — resuming is a bonus, never a blocker */ }
}
function loadProgress(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.state || (Date.now() - (d.savedAt || 0)) > SAVE_TTL_MS){
      localStorage.removeItem(SAVE_KEY);
      return false;
    }
    Object.assign(state, d.state);
    state.cardPhotos = [];      /* never restored — see above */
    state.submitting = false;
    state.submitted  = false;
    if(d.resumeToken) RESUME_TOKEN = d.resumeToken;
    return true;
  } catch(e){ return false; }
}
function clearProgress(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

/* Survives an IP change mid-session (phone dropping off wifi), so the server can
   keep updating one partial lead instead of creating a new row each beacon. */
const SESSION_ID = 'sid_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

/* Set when the patient arrived through a texted resume link, and sent back on
   every beacon from then on. A resumed visit is a brand-new session id, often
   on a different device, so this is the only thing that still ties them to the
   row they started — without it they get a second partial row and the first is
   left behind for the drop-off nudge to text. */
let RESUME_TOKEN = '';

/* Shape the server expects. Photos are only attached on the final submit. */
function payload(extra){
  const p = {
    sid: SESSION_ID,
    step: state.step,
    reason: state.reason,
    firstName: state.firstName, lastName: state.lastName,
    phone: state.phone, dob: state.dob, email: state.email,
    state: state.manualState,
    needsCategories: state.needsCategories,
    cgmType: state.cgmType, cgmReason: state.cgmReason,
    pumpStatus: state.pumpStatus, pumpType: state.pumpType,
    doctorName: state.doctorName, doctorContact: state.doctorContact,
    insuranceMethod: state.insurance,
    insuranceProvider: state.manualProvider,
    insuranceOther: state.manualOtherProvider,
    memberId: state.manualMemberId,
    secondary: {
      method: state.secondaryMethod,
      provider: state.secondaryProvider,
      memberId: state.secondaryMemberId,
    },
    proceedChoice: state.proceedChoice,
    callBooked: state.callBooked,
  };
  if(RESUME_TOKEN) p.resumeToken = RESUME_TOKEN;
  return Object.assign(p, extra || {});
}

/* Fire-and-forget partial-lead update. Never blocks or surfaces errors to the
   patient — a dropped beacon just means the board is one step out of date. */
function track(extra){
  if(state.submitted) return;
  try {
    fetch(TRACK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload(extra)),
      keepalive: true,
    }).catch(function(){});
  } catch(e){}
}

/* Push a partial the moment we have someone we could actually contact, rather
   than waiting for the patient to leave the step. The old JotForm tracker
   beaconed on every field blur, and drop-off follow-up is worthless if the row
   only appears once they have already finished the page (HANDOFF §10: create
   the item AT step 2, as soon as we have name/phone/email).

   Debounced so typing a 10-digit phone sends one beacon, not ten. */
let trackTimer = null;
function trackSoon(){
  clearTimeout(trackTimer);
  trackTimer = setTimeout(function(){
    /* A lone first name is not a lead — wait until there is a way to reach
       them, which is also the minimum the backend will record. */
    const reachable = state.phone.replace(/\D/g,'').length >= 10 || validEmail(state.email);
    if(state.firstName.trim() && reachable) track();
  }, 1500);
  saveProgress();
}

/* Unload uses sendBeacon with text/plain so it survives the page going away
   without tripping a CORS preflight. */
function trackOnUnload(){
  if(state.submitted) return;
  try {
    const body = JSON.stringify(payload());
    if(navigator.sendBeacon){
      navigator.sendBeacon(TRACK_URL, new Blob([body], { type: 'text/plain' }));
    }
  } catch(e){}
}
window.addEventListener('pagehide', trackOnUnload);

const dividers = {
  4: "Almost there — let's find your care team.",
  7: "Last step before we get this moving.",
};
const REASON_LABELS = {
  pharmacy: 'pharmacy pricing',
  denied: 'getting denied by insurance',
  supplier: 'your supplier dropping you',
  fingerprick: 'wanting off the finger prick',
};

function setDivider(n){
  const d = document.getElementById('divider');
  if(dividers[n]){ d.textContent = dividers[n]; d.classList.add('show'); }
  else { d.classList.remove('show'); d.textContent=""; }
}
function go(n){
  const advancing = n > state.step;
  state.step = n;
  document.getElementById('fill').style.width = (n/7*100)+"%";
  setDivider(n);
  render();
  window.scrollTo(0, 0);
  /* Only beacon on forward progress — going Back shouldn't rewrite the
     drop-off step to an earlier one than the patient actually reached. */
  if(advancing) track();
  saveProgress();
}
function card(html){
  const el = document.getElementById('card');
  el.innerHTML = html;
  dockActions(el);
}
/* Wraps the trailing action area in .action-dock so it can be sticky (see the
   CSS note). Done HERE, once, rather than in each step's template: there are a
   dozen call sites and a step that forgot the wrapper would silently lose the
   sticky behaviour — the button would just sit under the toolbar again, which
   is precisely the bug this exists to stop.

   Anchored on the LAST primary button rather than the first, so a mid-flow
   button (the insurance photo screen has one) can never swallow the rest of
   the step into the dock. Everything after it — the hint line, the privacy
   line, "Save & finish later" — belongs to the action and rides along. Steps
   with no primary button (the completed screen) simply aren't docked. */
function dockActions(el){
  const kids = [...el.children];
  let i = -1;
  for(let n = kids.length - 1; n >= 0; n--){
    if(kids[n].classList.contains('cont-wrap') || kids[n].classList.contains('btn-primary')){ i = n; break; }
  }
  el.classList.toggle('no-dock', i < 0);
  if(i < 0) return;
  const dock = document.createElement('div');
  dock.className = 'action-dock';
  el.insertBefore(dock, kids[i]);
  for(const n of kids.slice(i)) dock.appendChild(n);
}
/* Every step re-renders from state, so anything the patient typed goes back
   through innerHTML. Escape it or a stray quote breaks out of the attribute. */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function backLine(action){
  return action ? `<div class="back-line" onclick="${action}">&larr;</div>` : '';
}
/* The wrapper catches taps on a DISABLED Continue (its pointer-events:none
   lets the tap fall through) and answers with what's blocking — a greyed
   button that silently ignores the tap is exactly how a patient with an
   xx/xx/xx date of birth gets stuck with no idea why (Josh, 2026-08-18). */
function continueBtn(cont, disabled){
  return `<div class="cont-wrap" onclick="blockedContinueTap(event)">
    <button class="btn-primary btn-primary-full" ${disabled?'disabled':''} onclick="${cont}">Continue</button>
  </div><div class="cont-hint" id="contHint"></div>`;
}

/* ---------------------------------------------------------------------------
   Save & finish later.

   This used to say "We've saved your progress on this device" and stop there.
   That was true only of one browser's localStorage — it did not survive the
   patient switching to a laptop, clearing history, or having been in a private
   tab — and nothing ever brought them back. Now we text them a link that
   reopens the form wherever they open it, on the step they left, with their
   answers already in it. The local save stays as the same-device fallback.
--------------------------------------------------------------------------- */
function triggerSaveFinish(){
  saveProgress();

     save pill sits after step 2, which requires a valid phone, so this is the
     unreachable-in-practice branch — but the whole feature is a text message,

/* The same mask as the step-2 field, without its side effects: the only button
   on this screen is "Text me my link", and refreshContinue() would judge it
   against whichever step the patient paused on and disable it. */
function formatSavePhone(el){

function renderSavingLink(){
  card(`
    <div class="confirm-title" style="margin-top:28px;">Texting you your link…</div>
    <div class="confirm-sub">One second.</div>
  `);

function sendResumeLink(){
  if(!validPhone(state.phone)){
    renderSavePhonePrompt(phoneProblem(state.phone));
    return;
  }
  renderSavingLink();

  /* The state the link restores. Sent whole rather than reassembled from the
     tracking payload: that shape is built for monday's columns and loses the
     things that make a resume exact — which phase of a step they were on, an
     answer with no board equivalent. The server whitelists it on the way in. */
  const snapshot = Object.assign({}, state);
  delete snapshot.cardPhotos; delete snapshot.submitting; delete snapshot.submitted;
  delete snapshot.cardUploadState;

  fetch(RESUME_LINK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload({
      savedForLater: true,
      formState: snapshot,
      /* Inside the marketing site's iframe this is the FORM's own URL, not the
         page framing it — which is what makes the texted link open the form
         standalone. The server still checks it against its allowlist. */
      formUrl: location.origin + location.pathname,
    })),
  })
  .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, d: d }; }); })
  .then(function(res){
    if(!res.ok || !res.d.ok) throw new Error((res.d && res.d.error) || 'send failed');
    renderLinkSent(res.d);
  })
  .catch(function(){
    /* The progress itself is safe on this device either way — say so, and give
       them the number, rather than implying the answers are gone. */
    card(`
      ${backLine('render()')}
      <h1 class="step-title">We couldn't send that text</h1>
      <p class="step-sub">Your answers are saved on this device, so this browser will still pick up where you left off. Try the text again, or reach us directly.</p>
      <div class="spacer"></div>
      <button class="btn-primary btn-primary-full" onclick="sendResumeLink()">Try again</button>
      <div style="text-align:center; font-size:13px; color:var(--ink-2); margin-top:14px;">
        Or text us at <a href="tel:+13475037148" style="color:var(--petrol); font-weight:600;">(347) 503-7148</a>
      </div>
    `);
  });
}

function renderLinkSent(d){

  /* `sent:false` means the link is real but the text didn't go out. Showing it

     one whose only route just failed silently. */
  const undelivered = d.sent === false;
  card(`

function copyResumeLink(){

    else { document.execCommand('copy'); }

     the country code is the correct and unsurprising thing to have done. */
  if(/^[01]/.test(before) && !(before.length === 11 && before[0] === '1')){

/* --- validation ---------------------------------------------------------- */
function bindField(field, el){

function validEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim());
}
function validDOB(v){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v).trim());
  if(!m) return false;
  const mm = +m[1], dd = +m[2], yyyy = +m[3];
  const d = new Date(yyyy, mm - 1, dd);
  /* Round-trip guards against 02/31 and friends, which Date silently rolls over. */
  if(d.getFullYear() !== yyyy || d.getMonth() !== mm - 1 || d.getDate() !== dd) return false;
  return yyyy >= 1900 && d <= new Date();
}
function validStep2(){
  return state.firstName.trim() !== '' &&
         state.lastName.trim() !== '' &&

}
function validStep4(){

}
/* Re-evaluates the visible Continue button against whatever step we're on. */
function refreshContinue(){

  if(!btn) return;
  if(state.step === 2)      btn.disabled = !validStep2();
  else if(state.step === 4) btn.disabled = !validStep4();
  else if(state.step === 5) btn.disabled = !canContinueStep5();

/* --- Why is Continue grey? --------------------------------------------------
   Every rule that can disable Continue has a sentence a patient can act on.
   The messages surface two ways: leaving a filled-but-wrong field (blur), and
   tapping the greyed button itself. Nothing shouts while they're still
   typing, and untouched-empty fields only get flagged by the tap. */
function dobProblem(v){
  const s = String(v == null ? '' : v).trim();
  if(!s) return 'Enter your date of birth.';
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return 'Type it as MM/DD/YYYY — with all four digits of the year.';
  return validDOB(s) ? '' : 'That date doesn\'t look right — double-check the day, month and year.';
}
/* US phone numbers, validated rather than counted.
   ⚠️ MIRRORS server/src/phone.js — the rule lives in both because the form
   ships as one standalone file with no build step and cannot import it. That
   file's header carries the reasoning; server/test-phone.mjs pins the two
   together, so a change here that is not made there fails the suite.

        NXX - NXX - XXXX     N = 2-9, X = 0-9

   Both prefixes start 2-9 (no US number begins 0 or 1) and neither may be N11
   — 911, 411, 611 are service codes. Counting digits alone is what let
   "1347503714" through: our own number, typed with a leading 1 and the last
   digit dropped. It reached RingCentral and was rejected there. */
var NANP_10 = /^[2-9](?!11)\d{2}[2-9](?!11)\d{2}\d{4}$/;
function tenDigits(v){
  const d = String(v == null ? '' : v).replace(/\D/g,'');
  if(d.length === 10) return d;
  if(d.length === 11 && d[0] === '1') return d.slice(1);
  return '';
}
function validPhone(v){ return NANP_10.test(tenDigits(v)); }

/* The mask is a HARD BLOCKER, not a hint (Josh, 2026-08-19): a digit that
   could not begin a US phone number never lands in the field at all.

   ⚠️ THIS IS WHERE 1347503714 CAME FROM. The old mask stripped non-digits and
   truncated to ten BEFORE looking at what it had, so pasting or typing the
   eleven-digit +1 347 503 7148 kept the country code and threw away the last
   digit. The result is exactly ten digits long, so every length check in the
   pipeline waved it through, and it cannot be dialled. The country code is
   now removed BEFORE anything is truncated — order is the whole fix. */
function phoneDigits(raw){
  let d = String(raw == null ? '' : raw).replace(/\D/g,'');
  /* A leading 1 on an eleven-digit number is a country code, not an area
     code. Dropped first, so the last digit survives. */
  if(d.length === 11 && d[0] === '1') d = d.slice(1);
  /* Anything still starting 0 or 1 cannot be a US number. Dropped as typed,
     so the field can never hold one — this is the hard block. */
  while(d.length && (d[0] === '0' || d[0] === '1')) d = d.slice(1);
  return d.slice(0,10);
}
function phoneMask(d){
  if(d.length >= 7) return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
  if(d.length >= 4) return '(' + d.slice(0,3) + ') ' + d.slice(3);
  if(d.length > 0) return '(' + d;
  return '';
}
function phoneProblem(v){
  const d = String(v == null ? '' : v).replace(/\D/g,'');
  if(!d) return 'Enter your phone number.';
  const ten = tenDigits(v);
  if(!ten){
    return d.length < 10
      ? 'Phone numbers need 10 digits — this one has ' + d.length + '.'
      : 'That\'s ' + d.length + ' digits — a US number has 10.';
  }
  if(!/^[2-9]/.test(ten)) return 'US phone numbers don\'t start with a 0 or a 1 — check the first digit.';
  if(/^[2-9]11/.test(ten)) return 'That area code isn\'t a real one — check the first three digits.';
  if(!/^\d{3}[2-9]/.test(ten)) return 'The three digits after the area code can\'t start with a 0 or a 1.';
  if(/^\d{3}[2-9]11/.test(ten)) return 'Those middle three digits aren\'t a real prefix — check them.';
  return '';
}
function emailProblem(v){
  const s = String(v == null ? '' : v).trim();
  if(!s) return 'Enter your email.';
  return validEmail(s) ? '' : 'That email doesn\'t look complete — check for a typo.';
}

/* Input id → the message currently blocking it ('' = fine), for the step on
   screen. Mirrors validStep2/validStep4/canContinueStep5 — if a rule moves
   there, it moves here, or the button greys with no explanation again. */
function fieldProblemMap(){
  if(state.step === 2) return {
    fFirst: state.firstName.trim() ? '' : 'Enter your first name.',
    fLast:  state.lastName.trim()  ? '' : 'Enter your last name.',
    fPhone: phoneProblem(state.phone),
    fDob:   dobProblem(state.dob),
    stateInput: state.manualState.trim() ? '' : 'Enter your state.',
    fEmail: emailProblem(state.email),
  };
  if(state.step === 4) return {
    docName:    state.doctorName.trim()    ? '' : 'Enter your provider or clinic name.',
    docContact: state.doctorContact.trim() ? '' : 'Enter a phone number or location for them.',
  };
  if(state.step === 5 && state.insurance === 'manual'){
    const m = {};
    if(state.manualProvider === 'Other'){

    }
    m.mMemberId = state.manualMemberId.trim() ? '' : 'Enter your member ID.';
    return m;
  }
  return {};
}

function setFieldErr(inputId, msg){
  const el = document.getElementById(inputId);
  const err = document.getElementById('err-' + inputId);
  if(el && el.classList) el.classList.toggle('invalid', !!msg);
  if(err){ err.textContent = msg; err.classList.toggle('show', !!msg); }
}

/* Blur: flag a field the patient filled in and got wrong. An empty field they
   tabbed past isn't a mistake yet — the tap on Continue covers those. */
function revealFieldErr(inputId, value){
  if(!String(value == null ? '' : value).trim()) return;
  const map = fieldProblemMap();
  if(inputId in map) setFieldErr(inputId, map[inputId]);
}

/* Keep whatever is already flagged live as they fix it, and drop the hint the
   moment the button un-greys. Never ADDS a flag mid-typing. */
function refreshVisibleErrors(){
  const map = fieldProblemMap();
  for(const id in map){
    const err = document.getElementById('err-' + id);
    if(err && err.classList.contains('show')) setFieldErr(id, map[id]);
  }
  const btn = document.querySelector('#card .btn-primary');
  const hint = document.getElementById('contHint');
  if(hint && btn && !btn.disabled){ hint.textContent = ''; hint.classList.remove('show'); }
}

function blockedContinueTap(e){
  /* An ENABLED button's click bubbles here too — its own handler already ran
     and may have re-rendered. Only the fall-through tap (target is the
     wrapper, not a button) means "the patient hit a wall". */
  if(e && e.target && e.target.closest && e.target.closest('button')) return;
  const btn = document.querySelector('#card .btn-primary');
  if(!btn || !btn.disabled) return;

  let msg = '';

  } else {
    const map = fieldProblemMap();
    let n = 0, firstId = null;
    for(const id in map){
      if(map[id]){ n++; if(!firstId) firstId = id; }
      setFieldErr(id, map[id]);
    }
    msg = n === 0 ? 'Something above still needs attention.'
      : n === 1 ? 'One thing needs a fix — it\'s highlighted above.'
      : 'A few things need a fix — they\'re highlighted above.';
    const first = firstId && document.getElementById(firstId);
    if(first && first.scrollIntoView) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  const hint = document.getElementById('contHint');
  if(hint){ hint.textContent = msg; hint.classList.add('show'); }
}

const CGM_TYPE_OPTS = ['Freestyle Libre 3 Plus','Dexcom G7','Medtronic Guardian 4','Any will work'];
const CGM_REASON_OPTS = ['I am injecting insulin','I have had at least one low blood sugar (hypoglycemic) event','Neither applies'];

const PUMP_TYPE_OPTS_HAVE = ['Tandem t:slim X2','Tandem Mobi','Beta Bionics iLet',"I'm not sure which pump I have"];

function step3Phases(){
  const phases = ['categories'];
  if(state.needsCategories.includes('cgm')){ phases.push('cgmType'); phases.push('cgmReason'); }
  if(state.needsCategories.includes('pump')){
    phases.push('pumpStatus');
    if(state.pumpStatus === 'Need a new insulin pump' || state.pumpStatus === 'Only need insulin pump supplies'){
      phases.push('pumpType');
    }
  }

}
function toggleCategory(c){

  if(idx>-1) state.needsCategories.splice(idx,1); else state.needsCategories.push(c);
  renderNeeds();
}
function step3Advance(){
  const phases = step3Phases();
  if(state.step3PhaseIdx < phases.length - 1){ state.step3PhaseIdx++; renderNeeds(); }
  else { go(4); }
}
function step3Back(){
  if(state.step3PhaseIdx > 0){ state.step3PhaseIdx--; renderNeeds(); }
  else { go(2); }

function setCgmType(v){ state.cgmType=v; renderNeeds(); }

function getProductLabel(){
  const hasCGM = state.needsCategories.includes('cgm');
  const hasPump = state.needsCategories.includes('pump');
  let cgmLabel = '';
  if(hasCGM){
    if(state.cgmType==='Dexcom G7') cgmLabel='Dexcom G7 CGM';
    else if(state.cgmType==='Freestyle Libre 3 Plus') cgmLabel='Freestyle Libre 3 Plus CGM';
    else if(state.cgmType==='Medtronic Guardian 4') cgmLabel='Medtronic Guardian 4 CGM';
    else cgmLabel='CGM';
  }
  /* Supplies-only patients read "insulin pump" as us shipping a pump they
     didn't ask for (Brandon, 2026-08-18) — say what's actually coming. */
  const pumpLabel = hasPump
    ? (state.pumpStatus === 'Only need insulin pump supplies' ? 'insulin pump supplies' : 'insulin pump')
    : '';
  if(cgmLabel && pumpLabel) return cgmLabel + ' + ' + pumpLabel;
  return cgmLabel || pumpLabel || 'your order';
}

/* Card photos ride along with the submission for a human to read on our end.
   Downscale first — a current phone camera produces ~4MB per shot, which is
   slow over cell data and bigger than the API will take.

   The file inputs deliberately carry NO `capture` attribute: capture forces
   the camera open, and this flow promises an UPLOAD — the native picker lets
   the patient hand us a shot they already took (and still offers the camera
   on the sheet for anyone who wants it). */
function readCardPhoto(input, slot){
  const file = input.files && input.files[0];
  if(!file) return;
  const fail = function(){
    alert("We couldn't read that photo. Try again, or enter your details by hand.");
  };
  const reader = new FileReader();
  reader.onerror = fail;
  reader.onload = function(){
    const img = new Image();
    img.onerror = fail;
    img.onload = function(){
      const max = 1600;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width  = Math.max(1, Math.round(img.width  * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      state.cardPhotos[slot] = c.toDataURL('image/jpeg', 0.8);
      /* No auto-advance: the upload screen re-renders into its confirmation
         state and the patient moves on with its Continue button — a jump cut
         straight to the provider list read as the upload failing. */
      uploadCardPhoto(slot);
      renderInsurance();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
/* Send one card photo STRAIGHT to the patient's monday row, the moment it's
   picked (Josh, 2026-08-18) — not on submit. The submit-time attach stays as
   the fallback for any photo this didn't land, so a monday hiccup costs the
   instant-ness, never the photo. */
function uploadCardPhoto(slot){
  const photo = state.cardPhotos[slot];
  if(!photo) return;
  state.cardUploadState[slot] = 'uploading';
  if(slot === 0) state.cardFrontUploaded = false; else state.cardSecondaryUploaded = false;

  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 20000) : null;

  fetch(CARD_PHOTO_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload({ photo: photo, slot: slot })),
    signal: ctrl ? ctrl.signal : undefined,
  })
  .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return r.ok && d.ok; }); })
  .then(function(ok){
    if(!ok) throw new Error('upload failed');
    if(slot === 0) state.cardFrontUploaded = true; else state.cardSecondaryUploaded = true;
    state.cardUploadState[slot] = 'done';
  })
  .catch(function(){
    state.cardUploadState[slot] = 'failed';
  })
  .then(function(){
    if(timer) clearTimeout(timer);
    saveProgress();
    /* Repaint ONLY the screen that is waiting on this: the primary card's
       confirmation. Slot 1 finishes under the fields screen, where a repaint
       would yank the focus out of the member-ID input mid-word. */
    if(state.step === 5 && slot === 0 && state.insurancePhase === 'photoCapture') renderInsurance();
  });
}

/* ---------- Step 7: Completed ---------- */
/* Call openings come from Calendly's own inline widget.
 *
 * They used to be invented here: four plausible times built from the visitor's
 * own clock and stored as the rendered STRING. Two things were wrong with that.
 * Nothing was reserved, so the "booking" only ever existed on this screen — and
 * the string was in the visitor's timezone, so a patient in Phoenix picking
 * "Today 2:00 PM" produced a row a New York rep read as 2:00 PM Eastern and
 * called three hours early. Neither failure surfaced an error.
 *
 * The replacement was a hand-rolled picker over Calendly's availability, which
 * meant WE had to render each opening in the patient's zone — so this file
 * detected the browser timezone and carried it around, defaulting to Eastern
 * when detection failed. That was still us doing Calendly's job, and the
 * booking half of it never worked: the API refuses every request on this
 * account.
 *
 * Now the widget owns all of it — availability, timezone conversion, slot
 * races, the confirmation email. It reads the visitor's zone itself, so there
 * is no timezone for this file to detect, pass along, or default to, and no
 * Eastern fallback that could mislabel an out-of-state patient's call.
 *
 * All we ask the backend is WHICH event type to mount. The Calendly token
 * lives on the server — the browser must never see it. */
function loadSlots(){
  if(state.slotsRequested) return;
  state.slotsRequested = true;

  /* schedulingUrl carries all three states on its own, so there is no second
     flag to keep in step with it: undefined = still asking, a URL = mount the
     widget, '' = scheduling is off or unreachable, fall back to a human. */
  fetch(SCHEDULING_URL)
    .then(function(r){ return r.json(); })
    .then(function(d){
      state.schedulingUrl = d.enabled ? d.url : '';
      render();
    })
    .catch(function(){
      state.schedulingUrl = '';
      render();
    });
}

/* Mount Calendly's inline widget once the container is on the page.
   Loaded lazily so a patient who never asks for a call never fetches it.

   The guard is the HOST, not a "did we mount once" flag. render() replaces the
   whole card, so every re-render hands us a brand-new empty #calendlyHost — and
   a one-way flag made the second render permanent: it bailed out, leaving the
   patient a blank 640px gap where the calendar had been. Whether an iframe is
   sitting in the host is the only question worth asking. `calendlyLoading` is
   separate and narrower: it keeps concurrent renders from appending the SDK
   script twice while the first copy is still in flight. */
function mountCalendly(){
  if(!state.schedulingUrl) return;
  var host = document.getElementById('calendlyHost');
  if(!host || host.querySelector('iframe')) return;

  var url = state.schedulingUrl
    + '?hide_gdpr_banner=1'
    + '&name=' + encodeURIComponent([state.firstName, state.lastName].filter(Boolean).join(' '))
    + '&email=' + encodeURIComponent(state.email || '');

  function init(){
    var el = document.getElementById('calendlyHost');
    if(!el || el.querySelector('iframe') || !window.Calendly) return;
    window.Calendly.initInlineWidget({ url: url, parentElement: el, prefill: {} });
  }

  if(window.Calendly){ init(); return; }
  if(state.calendlyLoading) return;
  state.calendlyLoading = true;

  var s = document.createElement('script');
  s.src = 'https://assets.calendly.com/assets/external/widget.js';
  s.async = true;
  s.onload = init;
  /* Drop the scheduling URL, don't just flag the error. The widget branch of
     slotPickerHtml() only tests schedulingUrl, so leaving it set kept us
     rendering a host div for an SDK that will never arrive — a blank box
     instead of the "a care navigator will call you" fallback that the patient
     can actually act on. */
  s.onerror = function(){
    state.calendlyLoading = false;
    state.schedulingUrl = '';
    render();
  };
  document.head.appendChild(s);
}

/* Calendly tells the parent page when the booking lands. This is what closes
   the loop for the PATIENT — the webhook closes it for us, but it is
   server-side and the confirmation screen can't wait on it. */
window.addEventListener('message', function(e){
  if(!e.origin || e.origin.indexOf('calendly.com') === -1) return;
  var d = e.data || {};
  if(d.event !== 'calendly.event_scheduled') return;
  state.callBooked = 'scheduled';
  render();
});
function renderCompleted(){
  /* Never show "we started the process" until the server actually has it. */
  if(!state.proceedChoice || !state.submitted){
    /* A NEW pump never goes straight to a doctor request — which pump, and
       what their plan covers, is exactly what the intake call settles. Those
       patients get one path: the call. Supplies-only pump patients (and
       everyone else) keep both. */
    if(state.pumpStatus === 'Need a new insulin pump'){
      card(`
        ${backLine('go(6)')}
        <h1 class="step-title">Last step — book a quick call</h1>
        <p class="step-sub">A new insulin pump starts with a 10-minute call: we'll help you land on the right pump, then get it moving with your doctor.</p>
        <div class="options">
          <button class="opt" onclick="setProceed('call')"><span class="lbl">Book my 10-minute call</span><span class="mark-arrow"></span></button>
        </div>
      `);
      return;
    }
    card(`
      ${backLine('go(6)')}
      <h1 class="step-title">Ready for us to contact your doctor?</h1>
      <div class="options">
        <button class="opt" onclick="setProceed('request')"><span class="lbl">Yes, send my request now</span><span class="mark-arrow"></span></button>
        <button class="opt" onclick="setProceed('call')"><span class="lbl">I have a few questions first — book a 10-minute call</span><span class="mark-arrow"></span></button>
      </div>
    `);
    return;
  }
  document.getElementById('divider').classList.remove('show');
  const isCall = state.proceedChoice === 'call';
  const title = isCall ? "Woohoo — we'll be calling you soon!" : "Woohoo — we started the process!";
  /* The request path's copy is Josh's, 2026-08-19, and it is a commitment with
     a clock on it — 24 hours, a tracking link, and a prescription the patient
     can hand their provider — so it is deliberately concrete where the line it
     replaced ("we'll reach out with an update on your CGM soon") was not. Two
     sentences, split so neither becomes a centred paragraph nobody reads. */
  const sub = isCall ? "Look forward to meeting you." : null;
  card(`
    <div class="confirm-check">✓</div>
    <div class="confirm-title">${title}</div>
    ${sub
      ? `<div class="confirm-sub">${sub}</div>`
      : `<div class="confirm-sub" style="margin-bottom:8px;">A care coordinator will be reaching out in the next 24 hours with a link where you can track your order status.</div>
         <div class="confirm-sub">We'll also attach a prescription that you can send your provider to help speed things along.</div>`}
    ${isCall && !state.callBooked ? slotPickerHtml() : ""}
    ${isCall && state.callBooked ? `
      <div style="text-align:center; margin-bottom:14px; padding:12px; background:var(--mint); border-radius:12px;">
        <div style="font-weight:700; color:var(--petrol);">✓ You're booked</div>
        <!-- Calendly's postMessage carries URIs, not a time — and its own
             confirmation already showed the patient the slot they picked, so
             repeating it here from a guess would be worse than not saying it. -->
        <div class="hint" style="margin:2px 0 0;">Check your email for the confirmation.</div>
      </div>` : ""}
    ${state.insurance === 'none' ? `
      <div class="banner-note" style="background:var(--mint); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--petrol); margin-bottom:14px; line-height:1.5;">
        We still need your insurance card — text a photo to your care navigator at (347) 503-7148. We'll follow up on that specifically.
      </div>` : ""}
    <!-- A real .vcf served by the backend, not a data: URI — iOS ignores the
         download attribute on data: URIs entirely, so the old button did
         nothing on the phones patients actually finish on. The server picks
         inline (iOS: contact preview with "Create New Contact") vs attachment
         (Android/desktop: download that opens in Contacts). _blank keeps this
         confirmation screen — and the marketing site's iframe — in place. -->
    <a class="contact-btn" href="${CONTACT_CARD_URL}" target="_blank" rel="noopener">Add Medically Modern to your contacts</a>
    <ul class="next-steps">
      <li><span class="num">1</span> We send your prescription request to your doctor</li>
      <li><span class="num">2</span> We confirm your coverage and get you approved</li>
      <li><span class="num">3</span> Your supplies ship straight to your door</li>
    </ul>
    <div style="text-align:center; font-size:12px; color:var(--ink-2); margin-top:4px;">Have questions? Text your care navigator at (347) 503-7148</div>
  `);
}
function setProceed(v){
  state.proceedChoice = v;
  submitForm();
}
/* Every state of the picker has copy. A disabled or empty picker with no
   explanation is the thing patients phone in about. */
function slotPickerHtml(){
  if(state.schedulingUrl === undefined){
    loadSlots();
    return '<div style="margin-bottom:14px;"><label style="margin-bottom:8px;">Pick a time that works</label>'
      + '<div class="hint">Loading the calendar…</div></div>';
  }

  /* Calendly's own scheduling page, inline. It owns availability, timezone
     conversion, slot races and the confirmation email — all the things a
     hand-rolled picker has to get right and this one could not, because the
     booking API refuses every request on this account. Nothing here narrows
     what it shows: no timezone, no date, no month. Whatever a patient does or
     does not see is the event type's own availability, rendered in their own
     local time by the widget. */
  if(state.schedulingUrl){
    setTimeout(mountCalendly, 0);
    return '<div style="margin-bottom:14px;">'
      + '<label style="margin-bottom:8px;">Pick a time that works</label>'
      + '<div id="calendlyHost" style="min-width:280px;height:640px;"></div>'
      + '</div>';
  }

  /* Scheduling switched off, or Calendly unreachable. The patient is already
     recorded — say what happens next rather than showing a dead picker. This
     is the only other state there is: the widget either mounts and owns the
     booking, or it doesn't and a human picks the call up. */
  return '<div class="banner-note" style="background:var(--mint); border-radius:12px; padding:12px 14px;'
    + ' font-size:13px; color:var(--petrol); margin-bottom:14px; line-height:1.5;">'
    + "We've got your request — a care navigator will call you shortly to find a time."
    + '</div>';
}

/* ---------------------------------------------------------------------------
   Submit. The confirmation screen is only shown once the server has the record —
   telling a patient we've started when the write failed is worse than a retry.
--------------------------------------------------------------------------- */
function submitForm(opts){
  const silent = opts && opts.silent;
  if(state.submitting) return;
  state.submitting = true;

  if(!silent){
    card(`
      <div class="confirm-title" style="margin-top:28px;">One moment…</div>
      <div class="confirm-sub">Sending your information securely.</div>
    `);
  }

  fetch(SUBMIT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload({
      /* Only photos the instant upload didn't land — the rest are already on
         the row, and sending them again would duplicate the files. */
      cardPhotos: state.cardPhotos.filter(function(ph, i){
        return ph && !(i === 0 ? state.cardFrontUploaded : state.cardSecondaryUploaded);
      }),
      submitted: true,
    })),
  })
  .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, d: d }; }); })
  .then(function(res){
    state.submitting = false;
    if(!res.ok || !res.d.ok) throw new Error(res.d.error || 'Submission failed');
    state.submitted = true;
    clearProgress();   /* done — nothing left to resume */
    if(!silent) renderCompleted();
  })
  .catch(function(err){
    state.submitting = false;
    if(silent) return; /* the booking is a nice-to-have; don't derail a done form */
    card(`
      ${backLine('go(6)')}
      <h1 class="step-title">That didn't go through</h1>
      <p class="step-sub">We couldn't reach our system just now. Your answers are still here — try again, or text us and we'll take it from there.</p>
      <div class="spacer"></div>
      <button class="btn-primary btn-primary-full" onclick="submitForm()">Try again</button>
      <div style="text-align:center; font-size:13px; color:var(--ink-2); margin-top:14px;">
        Or text us at <a href="tel:+13475037148" style="color:var(--petrol); font-weight:600;">(347) 503-7148</a>
      </div>
    `);
  });
}

/* ---------------------------------------------------------------------------
   Boot.

   Three ways in, in order of how much they know about the patient:
     1. A texted resume link — their state comes back from the server and works
        on any device, which is the whole point of the link.
     2. This browser's own saved progress — same device, no link needed.
     3. A fresh start.
--------------------------------------------------------------------------- */
function startFromLocalOrScratch(){
  if(loadProgress() && state.step > 1){ go(state.step); }
  else { go(1); }
}

/* A restored state is applied over the defaults rather than replacing them, so
   a field the server didn't return keeps its initial value instead of becoming
   undefined and rendering as "undefined" in an input. */
function applyRestoredState(restored){
  Object.assign(state, restored || {});
  state.cardPhotos = [];      /* never travel with the link — see saveProgress */
  state.cardUploadState = {}; /* transient per-slot progress, never restored */
  state.submitting = false;
  state.submitted  = false;
  if(!Array.isArray(state.needsCategories)) state.needsCategories = [];
  const n = Number(state.step);
  state.step = (n >= 1 && n <= 7) ? n : 1;
}

/* `expired` here means the link no longer resolves to anything — almost always
   because the record behind it was closed out on our side, not because the
   patient waited too long. The copy says so: nothing they did caused this, and
   we still have what they told us. */
function renderResumeFailed(expired){
  card(`
    <div class="confirm-title" style="margin-top:20px;">${expired ? 'We can\'t open that one' : 'That link didn\'t work'}</div>
    <div class="confirm-sub">${expired
      ? 'That saved form isn\'t available anymore. Text us and we\'ll pick up from what you already told us, or start fresh below.'
      : 'We couldn\'t open that saved form. You can start again below, or text us and we\'ll take it from there.'}</div>
    <div class="spacer"></div>
    <button class="btn-primary btn-primary-full" onclick="startFromLocalOrScratch()">Start the form</button>
    <div style="text-align:center; font-size:13px; color:var(--ink-2); margin-top:14px;">
      Or text us at <a href="tel:+13475037148" style="color:var(--petrol); font-weight:600;">(347) 503-7148</a>
    </div>
  `);
}

function resumeFromToken(token){
  card(`
    <div class="confirm-title" style="margin-top:28px;">Picking up where you left off…</div>
    <div class="confirm-sub">One second.</div>
  `);

  fetch(RESUME_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token }),
  })
  .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, d: d }; }); })
  .then(function(res){
    if(!res.ok || !res.d.ok){
      /* A dead link with usable local progress isn't a dead end — this may well
         be the same phone they saved from. Take the local copy silently. */
      if(loadProgress() && state.step > 1){ go(state.step); return; }
      renderResumeFailed(res.d && res.d.expired);
      return;
    }
    applyRestoredState(res.d.state);
    RESUME_TOKEN = token;   /* keeps this visit attached to the row they started */
    saveProgress();         /* the link worked once; make this device remember too */
    go(state.step);
    /* go() only beacons on forward movement, and resuming isn't movement. Send
       one anyway: it re-keys the row against this new session, and it moves the
       Last Form Activity clock the drop-off nudge reads — a patient who just
       came back should not be texted for having gone quiet. */
    track();
  })
  .catch(function(){
    /* Offline or the API is down. Local progress first, then a fresh start —
       never a spinner that sits there. */
    startFromLocalOrScratch();
  });
}

if(window.__mmResumeToken){
  resumeFromToken(window.__mmResumeToken);
  window.__mmResumeToken = '';   /* one use — a re-render must not re-fetch */
} else {
  startFromLocalOrScratch();
}
</script>
</body>
</html>
